version: '3.8'

services:
  # 1. Local LLM Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: gyaan-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1

  # 2. FastAPI Multi-Agent Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gyaan-backend
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOCAL_MODEL=ollama/qwen2.5:1.5b
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

  # 3. Next.js Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
    container_name: gyaan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # 4. Nginx Reverse Proxy (Unified Port 80)
  nginx:
    image: nginx:alpine
    container_name: gyaan-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ollama_models:
